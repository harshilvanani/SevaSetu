"url(#ah)"/><path d="M1576,583 L1589,583 Q1603,583 1603,597 L1603,815 Q1603,829 1617,829 L1630,829" fill="none" stroke="#5E2E7E" stroke-width="3" marker-end="url(#ah)"/><rect x="309" y="751" width="207" height="156" rx="16" fill="#FFFFFF" stroke="#F17225" stroke-width="2.5"/><text x="412.5" y="814.53" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">Submits a</text><text x="412.5" y="843.28" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">progress</text><text x="412.5" y="872.03" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">report</text><circle cx="311" cy="753" r="19" fill="#8441AB"/><text x="311" y="761" font-family="Poppins, Arial" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">1</text><rect x="574" y="505" width="207" height="156" rx="16" fill="#FFFFFF" stroke="#8441AB" stroke-width="2.5"/><text x="677.5" y="582.905" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">Adds it to the</text><text x="677.5" y="611.655" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">review queue</text><circle cx="576" cy="507" r="19" fill="#8441AB"/><text x="576" y="515" font-family="Poppins, Arial" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">2</text><rect x="839" y="259" width="207" height="156" rx="16" fill="#FFFFFF" stroke="#1F6B3A" stroke-width="2.5"/><text x="942.5" y="336.905" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">Opens</text><text x="942.5" y="365.655" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">Reviews</text><circle cx="841" cy="261" r="19" fill="#8441AB"/><text x="841" y="269" font-family="Poppins, Arial" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">3</text><rect x="1104" y="259" width="207" height="156" rx="16" fill="#FFFFFF" stroke="#1F6B3A" stroke-width="2.5"/><text x="1207.5" y="308.155" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">Approves,</text><text x="1207.5" y="336.905" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">adjusts with a</text><text x="1207.5" y="365.655" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">reason, or</text><text x="1207.5" y="394.405" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">rejects</text><circle cx="1106" cy="261" r="19" fill="#8441AB"/><text x="1106" y="269" font-family="Poppins, Arial" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">4</text><rect x="1369" y="505" width="207" height="156" rx="16" fill="#FFFFFF" stroke="#8441AB" stroke-width="2.5"/><text x="1472.5" y="582.905" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">Updates totals</text><text x="1472.5" y="611.655" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">and hours</text><circle cx="1371" cy="507" r="19" fill="#8441AB"/><text x="1371" y="515" font-family="Poppins, Arial" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">5</text><rect x="1634" y="751" width="207" height="156" rx="16" fill="#FFFFFF" stroke="#F17225" stroke-width="2.5"/><text x="1737.5" y="828.905" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">Is told the</text><text x="1737.5" y="857.655" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">result</text><circle cx="1636" cy="753" r="19" fill="#8441AB"/><text x="1636" y="761" font-family="Poppins, Arial" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">6</text><circle cx="80" cy="1007" r="14" fill="#F3EAF8"/><text x="80" y="1014" font-family="Poppins" font-size="19" font-weight="600" fill="#8441AB" text-anchor="middle">i</text><text x="106" y="1015" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">Pending and verified work are always shown separately, so totals are never overstated.</text><text x="1860" y="1050" font-family="Poppins" font-size="16" font-weight="500" fill="#6E675F" text-anchor="end">SevaSetu</text></svg>