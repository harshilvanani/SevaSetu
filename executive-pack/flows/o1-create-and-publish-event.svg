<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E2E7E"/></marker></defs><rect width="1920" height="1080" fill="#FDFBF7"/><text x="70" y="78" font-family="Poppins, Arial" font-size="22" font-weight="600" letter-spacing="2.6" fill="#8441AB">ORGANIZER JOURNEY · O1</text><text x="70" y="138" font-family="Lora, Georgia, serif" font-size="50" font-weight="600" fill="#222222">Create and publish an event</text><rect x="50" y="218" width="1820" height="238" rx="18" fill="#EEF6F0"/><rect x="50" y="218" width="8" height="238" rx="4" fill="#1F6B3A"/><text x="80" y="346" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="600" fill="#1F6B3A" text-anchor="start">Organizer</text><rect x="50" y="464" width="1820" height="238" rx="18" fill="#F7F1FB"/><rect x="50" y="464" width="8" height="238" rx="4" fill="#8441AB"/><text x="80" y="592" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="600" fill="#5E2E7E" text-anchor="start">SevaSetu</text><rect x="50" y="710" width="1820" height="238" rx="18" fill="#FFF7EC"/><rect x="50" y="710" width="8" height="238" rx="4" fill="#F17225"/><text x="80" y="838" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="600" fill="#B5480A" text-anchor="start">Volunteers</text><path d="M516,337 L570,337" fill="none" stroke="#5E2E7E" stroke-width="3" marker-end="url(#ah)"/><path d="M781,337 L794,337 Q808,337 808,351 L808,569 Q808,583 822,583 L835,583" fill="none" stroke="#5E2E7E" stroke-width="3" marker-end="url(#ah)"/><path d="M1046,583 L1059,583 Q1073,583 1073,569 L1073,351 Q1073,337 1087,337 L1100,337" fill="none" stroke="#5E2E7E" stroke-width="3" marker-end="url(#ah)"/><path d="M1311,337 L1324,337 Q1338,337 1338,351 L1338,569 Q1338,583 1352,583 L1365,583" fill="none" stroke="#5E2E7E" stroke-width="3" marker-end="url(#ah)"/><path d="M1576,583 L1589,583 Q1603,583 1603,597 L1603,815 Q1603,829 1617,829 L1630,829" fill="none" stroke="#5E2E7E" stroke-width="3" marker-end="url(#ah)"/><rect x="309" y="259" width="207" height="156" rx="16" fill="#FFFFFF" stroke="#1F6B3A" stroke-width="2.5"/><text x="412.5" y="308.155" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">Picks a</text><text x="412.5" y="336.905" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">template (e.g.</text><text x="412.5" y="365.655" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">Satsang, Part</text><text x="412.5" y="394.405" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">1)</text><circle cx="311" cy="261" r="19" fill="#8441AB"/><text x="311" y="269" font-family="Poppins, Arial" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">1</text><rect x="574" y="259" width="207" height="156" rx="16" fill="#FFFFFF" stroke="#1F6B3A" stroke-width="2.5"/><text x="677.5" y="322.53" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">Sets date,</text><text x="677.5" y="351.28" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">centre and</text><text x="677.5" y="380.03" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">seva roles</text><circle cx="576" cy="261" r="19" fill="#8441AB"/><text x="576" y="269" font-family="Poppins, Arial" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">2</text><rect x="839" y="505" width="207" height="156" rx="16" fill="#FFFFFF" stroke="#8441AB" stroke-width="2.5"/><text x="942.5" y="568.53" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">Checks it is</text><text x="942.5" y="597.28" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">ready to</text><text x="942.5" y="626.03" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">publish</text><circle cx="841" cy="507" r="19" fill="#8441AB"/><text x="841" y="515" font-family="Poppins, Arial" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">3</text><rect x="1104" y="259" width="207" height="156" rx="16" fill="#FFFFFF" stroke="#1F6B3A" stroke-width="2.5"/><text x="1207.5" y="322.53" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">Publishes,</text><text x="1207.5" y="351.28" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">optionally</text><text x="1207.5" y="380.03" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">weekly</text><circle cx="1106" cy="261" r="19" fill="#8441AB"/><text x="1106" y="269" font-family="Poppins, Arial" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">4</text><rect x="1369" y="505" width="207" height="156" rx="16" fill="#FFFFFF" stroke="#8441AB" stroke-width="2.5"/><text x="1472.5" y="568.53" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">Lists it on</text><text x="1472.5" y="597.28" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">Discover (or</text><text x="1472.5" y="626.03" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">private)</text><circle cx="1371" cy="507" r="19" fill="#8441AB"/><text x="1371" y="515" font-family="Poppins, Arial" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">5</text><rect x="1634" y="751" width="207" height="156" rx="16" fill="#FFFFFF" stroke="#F17225" stroke-width="2.5"/><text x="1737.5" y="828.905" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">Volunteers</text><text x="1737.5" y="857.655" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">can join</text><circle cx="1636" cy="753" r="19" fill="#8441AB"/><text x="1636" y="761" font-family="Poppins, Arial" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">6</text><circle cx="80" cy="1007" r="14" fill="#F3EAF8"/><text x="80" y="1014" font-family="Poppins" font-size="19" font-weight="600" fill="#8441AB" text-anchor="middle">i</text><text x="106" y="1015" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">Templates in English, Hindi and French. “Repeat weekly” creates 4, 8 or 12 copies in one step.</text><text x="1860" y="1050" font-family="Poppins" font-size="16" font-weight="500" fill="#6E675F" text-anchor="end">SevaSetu</text></svg>