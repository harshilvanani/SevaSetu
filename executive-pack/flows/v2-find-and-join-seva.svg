.5" y="843.28" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">volunteer on</text><text x="1737.5" y="872.03" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">the roster</text><circle cx="1636" cy="753" r="19" fill="#8441AB"/><text x="1636" y="761" font-family="Poppins, Arial" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">6</text><circle cx="80" cy="1007" r="14" fill="#F3EAF8"/><text x="80" y="1014" font-family="Poppins" font-size="19" font-weight="600" fill="#8441AB" text-anchor="middle">i</text><text x="106" y="1015" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">If the last spot is taken at the same moment, the volunteer is told right away; no seva is ever double-booked.</text><text x="1860" y="1050" font-family="Poppins" font-size="16" font-weight="500" fill="#6E675F" text-anchor="end">SevaSetu</text></svg>