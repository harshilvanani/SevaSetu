oke="#F17225" stroke-width="2.5" stroke-dasharray="9 6"/><text x="1711" y="828.905" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">Reads it; can opt</text><text x="1711" y="857.655" font-family="Poppins, Arial, sans-serif" font-size="23" font-weight="500" fill="#222222" text-anchor="middle">out of email</text><circle cx="1583" cy="753" r="19" fill="#F17225"/><text x="1583" y="761" font-family="Poppins, Arial" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">5</text><rect x="1760.2845458984375" y="735" width="88.7154541015625" height="29" rx="14.5" fill="#FFF1D9"/><text x="1804.6422729492188" y="753" font-family="Poppins, Arial" font-size="15" font-weight="600" fill="#B5480A" text-anchor="middle">Planned</text><circle cx="80" cy="1007" r="14" fill="#F3EAF8"/><text x="80" y="1014" font-family="Poppins" font-size="19" font-weight="600" fill="#8441AB" text-anchor="middle">i</text><text x="106" y="1015" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="400" fill="#525252" text-anchor="start">Replaces broad WhatsApp blasts with targeted messages to people who agreed to hear from the centre.</text><text x="1860" y="1050" font-family="Poppins" font-size="16" font-weight="500" fill="#6E675F" text-anchor="end">SevaSetu</text></svg>