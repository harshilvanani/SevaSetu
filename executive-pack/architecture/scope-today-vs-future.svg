<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E2E7E"/></marker></defs><rect width="1920" height="1080" fill="#FDFBF7"/><text x="70" y="78" font-family="Poppins, Arial" font-size="22" font-weight="600" letter-spacing="2.6" fill="#8441AB">SCOPE</text><text x="70" y="138" font-family="Lora, Georgia, serif" font-size="50" font-weight="600" fill="#222222">What changes from today to the future</text><rect x="70" y="200" width="1780" height="64" rx="14" fill="#3C285F"/><text x="94" y="242" font-family="Poppins" font-size="24" font-weight="600" fill="#fff"></text><text x="404" y="242" font-family="Poppins" font-size="24" font-weight="600" fill="#fff">Today</text><text x="1124" y="242" font-family="Poppins" font-size="24" font-weight="600" fill="#fff">Future (on AWS)</text><rect x="70" y="276" width="1780" height="96" rx="12" fill="#F7F1FB"/><text x="94" y="332" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="600" fill="#5E2E7E" text-anchor="start">Who uses it</text><text x="404" y="332" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="400" fill="#222222" text-anchor="start">Volunteers, organizers, admins</text><text x="1124" y="318.25" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="500" fill="#222222" text-anchor="start">Same, plus leaders with dashboards and 2-step sign-in for</text><text x="1124" y="345.75" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="500" fill="#222222" text-anchor="start">admins</text><rect x="70" y="382" width="1780" height="96" rx="12" fill="#FFFFFF"/><text x="94" y="438" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="600" fill="#5E2E7E" text-anchor="start">Apps</text><text x="404" y="438" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="400" fill="#222222" text-anchor="start">Website and installable app; phone apps in testing</text><text x="1124" y="438" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="500" fill="#222222" text-anchor="start">Website, plus iPhone and Android apps in the stores</text><rect x="70" y="488" width="1780" height="96" rx="12" fill="#F7F1FB"/><text x="94" y="544" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="600" fill="#5E2E7E" text-anchor="start">Where it runs</text><text x="404" y="544" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="400" fill="#222222" text-anchor="start">Supabase (United States) and Hostinger</text><text x="1124" y="544" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="500" fill="#222222" text-anchor="start">AWS in Canada (Montréal), backup copy in Calgary</text><rect x="70" y="594" width="1780" height="96" rx="12" fill="#FFFFFF"/><text x="94" y="650" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="600" fill="#5E2E7E" text-anchor="start">Rules and data</text><text x="404" y="650" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="400" fill="#222222" text-anchor="start">One secure database with all the rules</text><text x="1124" y="650" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="500" fill="#222222" text-anchor="start">Same database and rules, grows automatically, 2 data centres</text><rect x="70" y="700" width="1780" height="96" rx="12" fill="#F7F1FB"/><text x="94" y="756" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="600" fill="#5E2E7E" text-anchor="start">Safety</text><text x="404" y="756" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="400" fill="#222222" text-anchor="start">Access rules, audit log, security review</text><text x="1124" y="756" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="500" fill="#222222" text-anchor="start">Plus firewall, rate limits, encryption keys, monitoring</text><rect x="70" y="806" width="1780" height="96" rx="12" fill="#FFFFFF"/><text x="94" y="862" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="600" fill="#5E2E7E" text-anchor="start">Growth</text><text x="404" y="862" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="400" fill="#222222" text-anchor="start">Hundreds of volunteers</text><text x="1124" y="862" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="500" fill="#222222" text-anchor="start">Up to 50,000 volunteers, searches under 2 seconds</text><rect x="70" y="912" width="1780" height="96" rx="12" fill="#F7F1FB"/><text x="94" y="968" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="600" fill="#5E2E7E" text-anchor="start">New features</text><text x="404" y="968" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="400" fill="#222222" text-anchor="start">Discover, join, hours, teams, dashboard, impact</text><text x="1124" y="968" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="500" fill="#222222" text-anchor="start">Plus application forms, badges, announcements, feedback</text></svg>